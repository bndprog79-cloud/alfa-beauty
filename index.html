  :root {
    --bg: #FAF6F1;

    --surface-2: #F3EAE2;
    --text: #3A2A24;
    --text-2: #7A6A62;
    --accent: #C98B8B;
    --accent-strong: #9A5B60;
    --on-accent: #FFFFFF;
    --gold: #C8A97E;
    --line: rgba(58,42,36,.10);
    --ill-fill: rgba(201,139,139,.18);
    --radius: 20px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    -webkit-text-size-adjust: 100%;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 2px; }
  #app { max-width: 480px; margin: 0 auto; padding: 16px 16px 0; min-height: 100vh; display: flex; flex-direction: column; }
  h1, h2, p { margin: 0; }

  .ill { background: var(--surface-2); border-radius: var(--radius-sm); overflow: hidden; }
  .ill svg { display: block; width: 100%; height: 100%; }
  .ill-tile { aspect-ratio: 200 / 140; border-radius: 0; }
  .ill-big { aspect-ratio: 200 / 140; margin-bottom: 16px; }
  .ill-mini { width: 48px; height: 48px; flex: none; }

  /* Главная */
  .hero { text-align: center; padding: 8px 0 16px; }
  .hero h1 { font-size: 30px; line-height: 1.2; }
  .hero .sub { color: var(--text-2); margin-top: 2px; }
  .hero .addr { color: var(--text-2); font-size: 13px; margin-top: 8px; }
  .lang { display: inline-flex; margin-top: 12px; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button {
    min-width: 52px; min-height: 44px; border: 0; background: transparent; color: var(--text-2);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--accent-strong); color: var(--on-accent); }
  .actions { display: flex; justify-content: center; gap: 24px; padding: 8px 0 20px; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; font-size: 13px; color: var(--text-2); min-width: 64px; }
  .action .circle {
    width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--line); color: var(--accent-strong);
  }
  .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .section-title { font-size: 20px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cat-card {
    display: flex; flex-direction: column; text-decoration: none; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  }
  .cat-card .body { padding: 10px 12px 12px; }
  .cat-card .name { font-weight: 600; line-height: 1.25; }
  .cat-card .count { color: var(--text-2); font-size: 13px; margin-top: 4px; }
  .footer { margin-top: auto; padding: 24px 0 calc(24px + env(safe-area-inset-bottom)); text-align: center; color: var(--text-2); font-size: 13px; }
  .footer-inner { border-top: 1px solid var(--gold); padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .footer a { color: var(--accent-strong); display: inline-block; min-height: 44px; line-height: 44px; }

  /* Категория и услуга */
  .back {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding-right: 12px;
    text-decoration: none; color: var(--accent-strong); font-weight: 600; align-self: flex-start;
  }
  .screen-head { margin: 8px 0 16px; }
  .screen-head h1 { font-size: 26px; line-height: 1.2; }
  .screen-head .from { color: var(--text-2); margin-top: 4px; }
  .list { list-style: none; margin: 0 0 24px; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .list li + li { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px; text-decoration: none; }
  .row .info { flex: 1; min-width: 0; }
  .row .name { line-height: 1.3; }
  .row .meta { color: var(--text-2); font-size: 13px; margin-top: 2px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .row .price { font-weight: 600; text-align: right; white-space: nowrap; font-size: 15px; }
  .row .chev { color: var(--text-2); font-size: 20px; }
  .hit { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--accent-strong); font-size: 12px; font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .card h1 { font-size: 26px; line-height: 1.2; }
  .card .price-big { font-size: 30px; font-weight: 700; margin-top: 8px; }
  .card .meta { color: var(--text-2); margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .card .desc { margin-top: 16px; }
  .card h2 { font-size: 18px; margin: 20px 0 8px; }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { position: relative; padding: 4px 0 4px 28px; }
  .checks li::before {
    content: ""; position: absolute; left: 4px; top: 10px; width: 12px; height: 6px;
    border-left: 2px solid var(--accent-strong); border-bottom: 2px solid var(--accent-strong); transform: rotate(-45deg);

  .book-bar { position: sticky; bottom: 0; margin-top: auto; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: var(--bg); }
  .btn-book {
    display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px;
    background: var(--accent-strong); color: var(--on-accent); text-decoration: none; font-weight: 600; text-align: center; padding: 8px 16px;

</style>
</head>

// ─────────── Язык ───────────
const LANG_KEY = 'alfa-beauty-lang';
const LANGS = Object.keys(priceData.ui);
let lang = loadLang();

function loadLang() {
  let saved = null;
  try { saved = window.localStorage.getItem(LANG_KEY); } catch (e) { saved = null; }
  if (saved && LANGS.indexOf(saved) !== -1) return saved;
  return LANGS.indexOf(priceData.meta.defaultLang) !== -1 ? priceData.meta.defaultLang : LANGS[0];
}

function saveLang(value) {
  try { window.localStorage.setItem(LANG_KEY, value); } catch (e) { /* хранилище недоступно */ }
}

function t(key) { return priceData.ui[lang][key]; }

// Текст из объекта {ru, kk} на текущем языке
function loc(obj) {
  if (!obj) return '';
  return obj[lang] != null ? obj[lang] : obj[priceData.meta.defaultLang];
}

function fill(template, vars) {
  return template.replace(/\{(\w+)\}/g, function (m, key) {
    return vars[key] != null ? vars[key] : m;
  });
}

// ─────────── Форматирование ───────────
const NBSP = ' ';
const CURRENCY = '₸';

function formatNumber(n) {
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
}

function formatAmount(n) { return formatNumber(n) + NBSP + CURRENCY; }

function formatPrice(price) {
  let s = formatAmount(price.amount);
  if (price.from) s = fill(t('priceFrom'), { price: s });
  if (price.per) s += t('perPrefix') + loc(price.per);
  return s;
}

function formatDuration(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  const parts = [];
  if (h) parts.push(h + NBSP + t('hours'));
  if (m || !h) parts.push(m + NBSP + t('minutes'));
  return t('durationApprox') + NBSP + parts.join(' ');
}

function pluralKey(n) {
  const d10 = n % 10, d100 = n % 100;
  if (d10 === 1 && d100 !== 11) return 'servicesOne';
  if (d10 >= 2 && d10 <= 4 && (d100 < 12 || d100 > 14)) return 'servicesFew';
  return 'servicesMany';
}

function formatCount(n) { return n + NBSP + t(pluralKey(n)); }

function minAmount(cat) {
  return Math.min.apply(null, cat.items.map(function (it) { return it.price.amount; }));
}

function formatDate(iso) {
  const p = String(iso).split('-');
  return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : String(iso);
}

// ─────────── Ссылки ───────────
const company = priceData.company;

function waLink(text) {
  return 'https://wa.me/' + company.whatsappNumber + '?text=' + encodeURIComponent(text);
}

function telLink() { return 'tel:+' + company.phone; }

function catHash(cat) { return '#/c/' + encodeURIComponent(cat.id); }

function itemHash(cat, item) { return '#/s/' + encodeURIComponent(cat.id) + '/' + encodeURIComponent(item.id); }

// ─────────── Построение DOM ───────────
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function externalLink(className, href) {
  const a = el('a', className);
  a.href = href;
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

// SVG берётся только из кода (ILLUSTRATIONS / ICONS), не из данных
function illustration(key, className) {
  const box = el('div', 'ill ' + className);
  box.innerHTML = Object.prototype.hasOwnProperty.call(ILLUSTRATIONS, key) ? ILLUSTRATIONS[key] : ILL_PLACEHOLDER;
  return box;
}

function icon(name) {
  const span = el('span', 'circle');
  span.innerHTML = ICONS[name];
  return span;
}

function hitBadge() { return el('span', 'hit', t('hit')); }

function backLink(href, parentKey, text) {
  const a = el('a', 'back');
  a.href = href;
  const arrow = el('span', null, '‹');
  arrow.setAttribute('aria-hidden', 'true');
  a.appendChild(arrow);
  a.appendChild(document.createTextNode(text));
  a.addEventListener('click', function (e) {
    // Если предыдущий экран в истории — этот же родитель, просто шаг назад
    if (routeKeys[currentIdx - 1] === parentKey) {
      e.preventDefault();
      history.back();
    }
  });
  return a;
}

function renderHome(app) {
  const hero = el('header', 'hero');
  hero.appendChild(el('h1', null, company.name));
  hero.appendChild(el('p', 'sub', loc(company.subtitle)));
  hero.appendChild(el('p', 'addr', loc(company.address)));

  const switcher = el('div', 'lang');
  LANGS.forEach(function (code) {
    const b = el('button', null, priceData.ui[code].langLabel);
    b.type = 'button';
    b.lang = code;
    b.setAttribute('aria-pressed', code === lang ? 'true' : 'false');
    b.addEventListener('click', function () { setLang(code); });
    switcher.appendChild(b);
  });
  hero.appendChild(switcher);
  app.appendChild(hero);

  const actions = el('nav', 'actions');
  const wa = externalLink('action', waLink(t('waGreeting')));
  wa.appendChild(icon('whatsapp'));
  wa.appendChild(el('span', null, t('actionWhatsapp')));
  const call = el('a', 'action');
  call.href = telLink();
  call.appendChild(icon('call'));
  call.appendChild(el('span', null, t('actionCall')));
  const route = externalLink('action', company.mapLink);
  route.appendChild(icon('route'));
  route.appendChild(el('span', null, t('actionRoute')));
  actions.appendChild(wa);
  actions.appendChild(call);
  actions.appendChild(route);
  app.appendChild(actions);

  app.appendChild(el('h2', 'section-title', t('categories')));
  const grid = el('div', 'grid');
  priceData.categories.forEach(function (cat) {
    const card = el('a', 'cat-card');
    card.href = catHash(cat);
    card.appendChild(illustration(cat.illustration, 'ill-tile'));
    const body = el('div', 'body');
    body.appendChild(el('div', 'name', loc(cat.name)));
    body.appendChild(el('div', 'count', formatCount(cat.items.length)));
    card.appendChild(body);
    grid.appendChild(card);
  });
  app.appendChild(grid);

  const footer = el('footer', 'footer');
  const inner = el('div', 'footer-inner');
  inner.appendChild(el('p', null, t('disclaimer')));
  inner.appendChild(el('p', null, fill(t('updatedAt'), { date: formatDate(priceData.meta.updatedAt) })));
  const insta = externalLink(null, company.instagram);
  insta.textContent = t('instagram');
  const instaWrap = el('p');
  instaWrap.appendChild(insta);
  inner.appendChild(instaWrap);
  inner.appendChild(el('p', null, '© ' + new Date().getFullYear() + ' ' + company.name));
  footer.appendChild(inner);
  app.appendChild(footer);

  document.title = company.name;
}

function renderCategory(app, cat) {
  app.appendChild(backLink('#/', 'home', t('categories')));

  const head = el('header', 'screen-head');
  head.appendChild(illustration(cat.illustration, 'ill-big'));
  head.appendChild(el('h1', null, loc(cat.name)));
  head.appendChild(el('p', 'from', fill(t('priceFrom'), { price: formatAmount(minAmount(cat)) })));
  app.appendChild(head);

  const list = el('ul', 'list');
  cat.items.forEach(function (item) {
    const li = el('li');
    const row = el('a', 'row');
    row.href = itemHash(cat, item);
    row.appendChild(illustration(item.illustration, 'ill-mini'));
    const info = el('div', 'info');
    info.appendChild(el('div', 'name', loc(item.name)));
    if (item.duration || item.hit) {
      const meta = el('div', 'meta');
      if (item.duration) meta.appendChild(el('span', null, formatDuration(item.duration)));
      if (item.hit) meta.appendChild(hitBadge());
      info.appendChild(meta);
    }
    row.appendChild(info);
    row.appendChild(el('div', 'price', formatPrice(item.price)));
    const chev = el('span', 'chev', '›');
    chev.setAttribute('aria-hidden', 'true');
    row.appendChild(chev);
    li.appendChild(row);
    list.appendChild(li);
  });
  app.appendChild(list);

  document.title = loc(cat.name) + ' · ' + company.name;
}

function renderItem(app, cat, item) {
  app.appendChild(backLink(catHash(cat), 'c/' + cat.id, loc(cat.name)));

  const card = el('article', 'card');
  card.appendChild(illustration(item.illustration, 'ill-big'));
  card.appendChild(el('h1', null, loc(item.name)));
  card.appendChild(el('p', 'price-big', formatPrice(item.price)));
  if (item.duration || item.hit) {
    const meta = el('p', 'meta');
    if (item.duration) meta.appendChild(el('span', null, formatDuration(item.duration)));
    if (item.hit) meta.appendChild(hitBadge());
    card.appendChild(meta);
  }
  if (item.desc && loc(item.desc)) card.appendChild(el('p', 'desc', loc(item.desc)));
  const includes = item.includes ? loc(item.includes) : null;
  if (includes && includes.length) {
    card.appendChild(el('h2', null, t('includes')));
    const ul = el('ul', 'checks');
    includes.forEach(function (text) { ul.appendChild(el('li', null, text)); });
    card.appendChild(ul);
  }
  app.appendChild(card);

  const bar = el('div', 'book-bar');
  const book = externalLink('btn-book', waLink(fill(t('waTemplate'), {
    name: loc(item.name),
    price: formatPrice(item.price)
  })));
  const ico = el('span');
  ico.innerHTML = ICONS.whatsapp;
  book.appendChild(ico.firstChild);
  book.appendChild(el('span', null, t('book')));
  bar.appendChild(book);
  app.appendChild(bar);

  document.title = loc(item.name) + ' · ' + company.name;
}

// ─────────── Маршрутизация ───────────
// #/ — главная, #/c/<catId> — категория, #/s/<catId>/<itemId> — услуга
function findById(list, id) {
  for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}

function safeDecode(s) {
  try { return decodeURIComponent(s); } catch (e) { return s; }
}

function parseRoute(hash) {
  const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(safeDecode);
  if (parts.length === 0) return { screen: 'home', key: 'home' };
  if (parts[0] === 'c' && parts.length === 2) {
    const cat = findById(priceData.categories, parts[1]);
    if (cat) return { screen: 'cat', key: 'c/' + cat.id, cat: cat };
  }
  if (parts[0] === 's' && parts.length === 3) {
    const cat = findById(priceData.categories, parts[1]);
    const item = cat ? findById(cat.items, parts[2]) : null;
    if (item) return { screen: 'item', key: 's/' + cat.id + '/' + item.id, cat: cat, item: item };
  }
  return null;
}

// Номер записи истории хранится в history.state.idx:
// меньше текущего — это «назад» (восстановить прокрутку), иначе — «вперёд» (наверх).
let currentIdx = 0;
let currentRoute = null;
const scrollPositions = {};
const routeKeys = {};

function render(route) {
  const app = document.getElementById('app');
  app.textContent = '';
  if (route.screen === 'cat') renderCategory(app, route.cat);
  else if (route.screen === 'item') renderItem(app, route.cat, route.item);
  else renderHome(app);
}

function onRoute() {
  let route = parseRoute(location.hash);
  const unknown = !route;
  if (unknown) route = { screen: 'home', key: 'home' };

  const state = history.state;
  let idx;
  let isBack = false;
  if (state && typeof state.idx === 'number') {
    idx = state.idx;
    isBack = idx < currentIdx;
  } else {
    idx = currentIdx + 1;
  }
  // Неизвестный адрес → главная, без лишней записи в истории
  if (unknown) history.replaceState({ idx: idx }, '', '#/');
  else history.replaceState({ idx: idx }, '');

  currentIdx = idx;
  currentRoute = route;
  routeKeys[idx] = route.key;
  render(route);
  window.scrollTo(0, isBack ? (scrollPositions[idx] || 0) : 0);
}

function setLang(code) {
  if (code === lang) return;
  lang = code;
  saveLang(code);
  document.documentElement.lang = code;
  const y = window.pageYOffset;
  render(currentRoute);
  window.scrollTo(0, y);
}

function init() {
  document.documentElement.lang = lang;
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.addEventListener('scroll', function () {
    scrollPositions[currentIdx] = window.pageYOffset;
  }, { passive: true });
  window.addEventListener('hashchange', onRoute);
  onRoute();
}

init();
</script>
